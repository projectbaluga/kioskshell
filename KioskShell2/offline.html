<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>KioskShell — Connection unavailable</title>
<style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0}
body{display:grid;place-items:center;background:#10141c;color:#eef3fa;font:20px "Segoe UI",system-ui,sans-serif;text-align:center}
main{width:min(88vw,680px);padding:48px 32px}.mark{font-size:56px;margin-bottom:18px}
h1{font-size:clamp(28px,5vw,44px);margin:0 0 14px}p{line-height:1.55;color:#b9c4d4}
.small{font-size:15px;opacity:.7;margin-top:32px}
</style>
</head>
<body><main>
<div class="mark" aria-hidden="true">⌁</div>
<h1>Connection unavailable</h1>
<p>This kiosk cannot currently reach its configured website. KioskShell is checking the connection and will reopen the website automatically when it is reachable.</p>
<p class="small">Use the top-edge drag gesture to open the KioskShell menu.</p>
</main></body></html>
