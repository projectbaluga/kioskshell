name: build-kioskshell-portable
on:
  push:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish portable single-file build
        run: |
          dotnet publish KioskShell/KioskShell.csproj -c Release -o portable/KioskShell-Portable -p:PublishSingleFile=true -p:SelfContained=true -p:IncludeNativeLibrariesForSelfExtract=true

      - name: Clean extra files (keep only what end-users need)
        shell: pwsh
        run: |
          $dir = "portable/KioskShell-Portable"
          Get-ChildItem $dir -Recurse -Include *.pdb,*.xml,*.deps.json | Remove-Item -Force -ErrorAction SilentlyContinue
          Get-ChildItem $dir -Filter "Microsoft.Web.WebView2.Wpf*" -Recurse | Remove-Item -Force -ErrorAction SilentlyContinue
          Get-ChildItem $dir -Directory -Recurse | Where-Object { $_.GetFiles('*','AllDirectories').Count -eq 0 } | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          Write-Host "--- Final package contents ---"
          Get-ChildItem $dir -Recurse | Select-Object FullName, Length | Format-Table -AutoSize

      - uses: actions/upload-artifact@v4
        with:
          name: KioskShell-Portable
          path: portable

      - name: Delete previous workflow runs
        if: success()
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $repo = "${{ github.repository }}"
          $current = ${{ github.run_id }}
          Write-Host "Current run id: $current"

          # List all completed runs of this workflow (keep the current one)
          $runs = gh api "repos/$repo/actions/runs?per_page=100" --jq '.workflow_runs[] | select(.status=="completed") | .id' 2>$null
          if (-not $runs) {
            Write-Host "No previous runs found (or API returned empty)."
            exit 0
          }

          foreach ($id in $runs) {
            if ($id -eq $current) { continue }
            Write-Host "Deleting workflow run $id ..."
            gh api -X DELETE "repos/$repo/actions/runs/$id" 2>$null
            if ($LASTEXITCODE -eq 0) {
              Write-Host "  Deleted $id"
            } else {
              Write-Host "  Could not delete $id (may already be gone or insufficient permission)"
            }
          }

          Write-Host "Cleanup done. Only the current run should remain."
