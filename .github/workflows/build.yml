name: build-kioskshell
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: KioskShell   # project lives in this subfolder of the repo
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish
        run: dotnet publish KioskShell.csproj -c Release -r win-x64 --self-contained true -o publish

      - name: Include setup files
        shell: pwsh
        run: Copy-Item AssignedAccess.xml, Apply-AssignedAccess.ps1, README.md publish/

      - uses: actions/upload-artifact@v4
        with:
          name: KioskShell-win-x64
          path: KioskShell/publish
